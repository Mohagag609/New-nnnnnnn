<!-- Title -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0 text-gray-800">الفواتير</h1>
    <a href="create-invoice.html" class="btn btn-primary">
        <i class="fas fa-plus me-2"></i>إنشاء فاتورة جديدة
    </a>
</div>

<!-- Invoices Table -->
<div class="card shadow-sm">
    <div class="card-header">
        <h6 class="m-0 font-weight-bold text-primary">قائمة الفواتير</h6>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered table-striped" id="invoicesTable" width="100%" cellspacing="0">
                <thead>
                    <tr>
                        <th>رقم الفاتورة</th>
                        <th>العميل</th>
                        <th>تاريخ الإصدار</th>
                        <th>تاريخ الاستحقاق</th>
                        <th>الإجمالي</th>
                        <th>الحالة</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="invoicesTableBody">
                    <!-- Invoice rows will be inserted here by app.js -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.dispatchEvent(new CustomEvent('invoicesPageLoaded'));
</script>
