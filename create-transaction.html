<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة معاملة جديدة - برنامج الخزينة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3">سند قبض / صرف</h1>
            <a href="index.html" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-right me-2"></i>العودة إلى الرئيسية
            </a>
        </div>

        <form id="detailedTransactionForm">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="m-0">تفاصيل المعاملة</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="transactionAccount" class="form-label">الخزنة/الحساب <span class="text-danger">*</span></label>
                            <select class="form-select" id="transactionAccount" required></select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="transactionType" class="form-label">نوع المعاملة <span class="text-danger">*</span></label>
                            <select class="form-select" id="transactionType" required>
                                <option value="قبض">قبض (إيراد)</option>
                                <option value="صرف">صرف (مصروف)</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="transactionAmount" class="form-label">المبلغ <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="transactionAmount" step="0.01" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="transactionDate" class="form-label">التاريخ <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="transactionDate" required>
                    </div>
                    <div class="mb-3">
                        <label for="transactionDescription" class="form-label">البيان / الوصف</label>
                        <textarea class="form-control" id="transactionDescription" rows="2"></textarea>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mt-4">
                <div class="card-header">
                    <h5 class="m-0">ربط المعاملة (اختياري)</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="transactionLinkType" class="form-label">ربط بـ</label>
                            <select class="form-select" id="transactionLinkType">
                                <option value="">بدون ربط</option>
                                <option value="clients">عميل</option>
                                <option value="suppliers">مورد</option>
                                <option value="projects">مشروع</option>
                                <option value="partners">شريك</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="transactionLinkId" class="form-label">الاسم</label>
                            <select class="form-select" id="transactionLinkId" disabled></select>
                        </div>
                    </div>
                    <!-- Detailed Link Info Section -->
                    <div id="linkDetails" class="d-none bg-light p-3 rounded border">
                        <!-- Details will be loaded here -->
                    </div>
                     <div id="invoicePaymentSection" class="mt-3 d-none">
                        <!-- Unpaid invoices will be loaded here -->
                    </div>
                </div>
            </div>

            <div class="text-end mt-4">
                <button type="submit" class="btn btn-primary btn-lg">حفظ المعاملة</button>
            </div>
        </form>
    </div>

    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
             document.dispatchEvent(new CustomEvent('createTransactionPageLoaded'));
        });
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
