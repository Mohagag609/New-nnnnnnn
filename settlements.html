<!-- Title -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0 text-gray-800">تسويات الشركاء</h1>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addSettlementModal">
        <i class="fas fa-plus me-2"></i>إضافة تسوية جديدة
    </button>
</div>

<!-- Settlements Table -->
<div class="card shadow-sm">
    <div class="card-header">
        <h6 class="m-0 font-weight-bold text-primary">سجل التسويات</h6>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered table-striped" id="settlementsTable" width="100%" cellspacing="0">
                <thead>
                    <tr>
                        <th>التاريخ</th>
                        <th>الشريك</th>
                        <th>المبلغ المسدد</th>
                        <th>الرصيد قبل التسوية</th>
                        <th>الرصيد بعد التسوية</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="settlementsTableBody">
                    <!-- Settlement rows will be inserted here by app.js -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Settlement Modal -->
<div class="modal fade" id="addSettlementModal" tabindex="-1" aria-labelledby="addSettlementModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addSettlementModalLabel">إضافة تسوية جديدة</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="addSettlementForm">
                    <div class="mb-3">
                        <label for="settlementPartner" class="form-label">اختر الشريك</label>
                        <select class="form-select" id="settlementPartner" required>
                            <option value="">جاري التحميل...</option>
                        </select>
                    </div>

                    <div id="partnerDetails" class="d-none">
                        <div class="row bg-light p-3 rounded border mb-3">
                            <div class="col-md-6">
                                <p class="mb-1"><strong>الرصيد السابق:</strong> <span id="partnerPreviousBalance">...</span></p>
                                <p class="mb-0"><strong>الرصيد الحالي (قبل التسوية):</strong> <span id="partnerCurrentBalance">...</span></p>
                            </div>
                            <div class="col-md-6">
                                <p class="mb-1"><strong>المبلغ المستحق:</strong> <span id="partnerOutstandingAmount">...</span></p>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="settlementAmount" class="form-label">المبلغ المدفوع من الشريك</label>
                        <input type="number" class="form-control" id="settlementAmount" step="0.01" required>
                    </div>

                     <div class="mb-3">
                        <label for="settlementDate" class="form-label">تاريخ التسوية</label>
                        <input type="date" class="form-control" id="settlementDate" required>
                    </div>

                    <div class="alert alert-info">
                        <strong>الرصيد النهائي بعد التسوية:</strong> <span id="partnerFinalBalance" class="fw-bold">...</span>
                    </div>

                    <div class="modal-footer">
                         <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
                         <button type="submit" class="btn btn-primary">حفظ التسوية</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.dispatchEvent(new CustomEvent('settlementsPageLoaded'));
</script>
