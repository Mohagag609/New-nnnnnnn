<!-- Title -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0 text-gray-800">إدارة المعاملات</h1>
    <a href="create-transaction.html" class="btn btn-primary">
        <i class="fas fa-plus me-2"></i>إضافة معاملة جديدة
    </a>
</div>

<!-- Transactions Table -->
<div class="card shadow-sm">
    <div class="card-header">
        <h6 class="m-0 font-weight-bold text-primary">سجل المعاملات</h6>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered table-striped" id="transactionsTable" width="100%" cellspacing="0">
                <thead>
                    <tr>
                        <th>التاريخ</th>
                        <th>الخزنة/الحساب</th>
                        <th>النوع</th>
                        <th>المبلغ</th>
                        <th>البيان</th>
                        <th>الجهة المرتبطة</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="transactionsTableBody">
                    <!-- Transaction rows will be inserted here by app.js -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.dispatchEvent(new CustomEvent('transactionsPageLoaded'));
</script>
