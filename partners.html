<!-- Title -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0 text-gray-800">إدارة الشركاء</h1>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPartnerModal">
        <i class="fas fa-plus me-2"></i>إضافة شريك جديد
    </button>
</div>

<!-- Partners Table -->
<div class="card shadow-sm">
    <div class="card-header">
        <h6 class="m-0 font-weight-bold text-primary">قائمة الشركاء</h6>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered table-striped" id="partnersTable" width="100%" cellspacing="0">
                <thead>
                    <tr>
                        <th>المعرّف</th>
                        <th>اسم الشريك</th>
                        <th>نسبة المشاركة (%)</th>
                        <th>الرصيد الحالي</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="partnersTableBody">
                    <!-- Partner rows will be inserted here by app.js -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Partner Modal -->
<div class="modal fade" id="addPartnerModal" tabindex="-1" aria-labelledby="addPartnerModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addPartnerModalLabel">إضافة شريك جديد</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="addPartnerForm">
                    <div class="mb-3">
                        <label for="partnerName" class="form-label">اسم الشريك</label>
                        <input type="text" class="form-control" id="partnerName" required>
                    </div>
                    <div class="mb-3">
                        <label for="partnerShare" class="form-label">نسبة المشاركة (%)</label>
                        <input type="number" class="form-control" id="partnerShare" min="0" max="100" step="0.01" required>
                    </div>
                     <div class="mb-3">
                        <label for="partnerBalance" class="form-label">الرصيد الافتتاحي</label>
                        <input type="number" class="form-control" id="partnerBalance" value="0" required>
                    </div>
                    <div class="modal-footer">
                         <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
                         <button type="submit" class="btn btn-primary">حفظ الشريك</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Edit Partner Modal -->
<div class="modal fade" id="editPartnerModal" tabindex="-1" aria-labelledby="editPartnerModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editPartnerModalLabel">تعديل بيانات الشريك</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editPartnerForm">
                    <input type="hidden" id="editPartnerId">
                    <div class="mb-3">
                        <label for="editPartnerName" class="form-label">اسم الشريك</label>
                        <input type="text" class="form-control" id="editPartnerName" required>
                    </div>
                    <div class="mb-3">
                        <label for="editPartnerShare" class="form-label">نسبة المشاركة (%)</label>
                        <input type="number" class="form-control" id="editPartnerShare" min="0" max="100" step="0.01" required>
                    </div>
                     <div class="mb-3">
                        <label for="editPartnerBalance" class="form-label">الرصيد الحالي</label>
                        <input type="number" class="form-control" id="editPartnerBalance" required>
                    </div>
                    <div class="modal-footer">
                         <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
                         <button type="submit" class="btn btn-primary">حفظ التعديلات</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.dispatchEvent(new CustomEvent('partnersPageLoaded'));
</script>
