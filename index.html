<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج الخزينة الشامل</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/print.css" media="print">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <aside class="bg-dark border-end" id="sidebar-wrapper">
            <div class="sidebar-heading border-bottom bg-dark text-white">
                <i class="fas fa-cash-register me-2"></i>برنامج الخزينة
            </div>
            <div class="list-group list-group-flush" id="sidebar-nav">
                <a href="#" class="list-group-item list-group-item-action list-group-item-dark p-3 active" hx-get="dashboard.html" hx-target="#main-content" hx-trigger="load">
                    <i class="fas fa-tachometer-alt me-2"></i>لوحة التحكم
                </a>
                <a href="#" class="list-group-item list-group-item-action list-group-item-dark p-3" hx-get="accounts.html" hx-target="#main-content">
                    <i class="fas fa-landmark me-2"></i>الخزن/الحسابات
                </a>
                <a href="#" class="list-group-item list-group-item-action list-group-item-dark p-3" hx-get="transactions.html" hx-target="#main-content">
                    <i class="fas fa-exchange-alt me-2"></i>المعاملات
                </a>
                <a href="#" class="list-group-item list-group-item-action list-group-item-dark p-3" hx-get="invoices.html" hx-target="#main-content">
                    <i class="fas fa-file-invoice me-2"></i>الفواتير
                </a>
                <hr class="text-white-50 my-1">
                <a href="#" class="list-group-item list-group-item-action list-group-item-dark p-3" hx-get="clients.html" hx-target="#main-content">
                    <i class="fas fa-users me-2"></i>العملاء
                </a>
                <a href="#" class="list-group-item list-group-item-action list-group-item-dark p-3" hx-get="suppliers.html" hx-target="#main-content">
                    <i class="fas fa-truck-moving me-2"></i>الموردين
                </a>
                 <a href="#" class="list-group-item list-group-item-action list-group-item-dark p-3" hx-get="partners.html" hx-target="#main-content">
                    <i class="fas fa-handshake me-2"></i>الشركاء
                </a>
                <a href="#" class="list-group-item list-group-item-action list-group-item-dark p-3" hx-get="settlements.html" hx-target="#main-content">
                    <i class="fas fa-file-invoice-dollar me-2"></i>تسويات الشركاء
                </a>
                <a href="#" class="list-group-item list-group-item-action list-group-item-dark p-3" hx-get="contractors.html" hx-target="#main-content">
                    <i class="fas fa-hard-hat me-2"></i>المقاولين
                </a>
                <a href="#" class="list-group-item list-group-item-action list-group-item-dark p-3" hx-get="projects.html" hx-target="#main-content">
                    <i class="fas fa-project-diagram me-2"></i>المشاريع
                </a>
                 <a href="#" class="list-group-item list-group-item-action list-group-item-dark p-3" hx-get="items.html" hx-target="#main-content">
                    <i class="fas fa-box-open me-2"></i>البنود/الخدمات
                </a>
                <hr class="text-white-50 my-1">
                <a href="#" class="list-group-item list-group-item-action list-group-item-dark p-3" hx-get="reports.html" hx-target="#main-content">
                    <i class="fas fa-chart-line me-2"></i>التقارير
                </a>
                <a href="#" class="list-group-item list-group-item-action list-group-item-dark p-3 mt-auto" hx-get="settings.html" hx-target="#main-content">
                    <i class="fas fa-cog me-2"></i>الإعدادات
                </a>
            </div>
        </aside>
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
                <div class="container-fluid">
                    <button class="btn btn-primary" id="sidebarToggle"><i class="fas fa-bars"></i></button>
                </div>
            </nav>
            <main class="container-fluid p-4" id="main-content"></main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
